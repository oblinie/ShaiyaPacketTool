name: Build ShaiyaPacketTool

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x86
        run: cmake -S . -B build -A Win32

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload DLL and TestLoader
        uses: actions/upload-artifact@v4
        with:
          name: ShaiyaPacketTool-Win32
          path: |
            build/Release/ShaiyaPacketTool.dll
            build/Release/TestLoader.exe
          if-no-files-found: error
